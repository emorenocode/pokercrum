@let currentplayer = player();

<header class="navbar">
  <div class="logo">
    <h1>PokerCrum</h1>
  </div>
  <nav>
    @if (currentplayer.username != '') {
      <button
        mat-icon-button
        title="Share Room"
        #shared
        (click)="openToShared(shared._elementRef.nativeElement, dialogToShared)"
      >
        <mat-icon>share</mat-icon>
      </button>
      <div
        class="player"
        title="{{ currentplayer.username }}"
        #avatar
        (click)="openUserInfo(avatar)"
      >
        {{ username() }}
      </div>
    }
  </nav>
</header>

<ng-template #dialogToShared let-link>
  <div class="dialog-to-shared">
    <button
      #qrCode
      type="button"
      class="qr-code-copy"
      aria-label="Copy QR code to clipboard"
      title="Copy QR code to clipboard"
      (click)="copyQrCode(qrCode)"
    >
      <qr-code value="{{ link }}" size="150" errorCorrectionLevel="M" margin="4" />
    </button>
    <button matButton (click)="copyLink()">
      Copy Link
      <mat-icon aria-hidden="false" aria-label="Link" fontIcon="link"></mat-icon>
    </button>
  </div>
</ng-template>
